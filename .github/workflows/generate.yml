name: Generate manifest
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  repository_dispatch:
    types: [refresh-manifest]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - name: Regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/detect.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain addons.json)" ]; then
            git config user.name "finn"
            git config user.email "finn@birich.de"
            git add addons.json
            git commit -m "chore(manifest): refresh addons.json"
            git push
          else
            echo "no change"
          fi
